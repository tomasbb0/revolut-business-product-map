  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

          title.className = &#x27;mini-node-title&#x27;;
          title.textContent = value[0];

        }));

        const edgeGroup = root.querySelector(&#x27;[data-mini-edges]&#x27;);
        const labelsContainer = root.querySelector(&#x27;[data-mini-edge-labels]&#x27;);
        const midArrowFeatures = new Set([
          &#x27;takePayments&#x27;,
          &#x27;linksInvoices&#x27;,
          &#x27;terminalPos&#x27;,
          &#x27;accountingSync&#x27;,
          &#x27;businessApi&#x27;,
          &#x27;businessIntegrations&#x27;

        const useMidDirectionArrows = midArrowFeatures.has(featureId);

        const edgeLabels = [];
        const directionArrows = [];

          const to = positions[edge[1]];
          const dx = to[0] - from[0];
          const dy = to[1] - from[1];
          const sourceRx = nodeWidth / 2 + 1;
          const sourceRy = compactDiagram ? (diagram.nodes.length &gt; 4 ? 14 : 17) : (diagram.nodes.length &gt; 4 ? 10 : 12);
          const sourceScale = 1 / Math.sqrt((dx * dx) / (sourceRx * sourceRx) + (dy * dy) / (sourceRy * sourceRy));

          const distance = Math.sqrt(dx * dx + dy * dy) || 1;
          const reverseExists = diagram.edges.some((candidate) =&gt; candidate[0] === edge[1] &amp;&amp; candidate[1] === edge[0]);
          const startsFromPlanNode = meta.hubs.includes(edge[0]);
          const duplicateIndex = diagram.edges.slice(0, index).filter((candidate) =&gt; candidate[0] === edge[0] &amp;&amp; candidate[1] === edge[1]).length;
          const curve = edge[3] !== undefined ? edge[3] : (reverseExists ? 7 + duplicateIndex * 13 : duplicateIndex * 9);
          const normal = [-dy / distance, dx / distance];
          const control = [(start[0] + end[0]) / 2 + normal[0] * curve, (start[1] + end[1]) / 2 + normal[1] * curve];
          const labelPoint = [
            0.25 * start[0] + 0.5 * control[0] + 0.25 * end[0],

          path.setAttribute(&#x27;d&#x27;, &#x27;M &#x27; + start[0] + &#x27; &#x27; + start[1] + &#x27; Q &#x27; + control[0] + &#x27; &#x27; + control[1] + &#x27; &#x27; + end[0] + &#x27; &#x27; + end[1]);
          edgePaths.push(path);

          label.title = stepText[index];
          const labelNumber = document.createElement(&#x27;span&#x27;);
          labelNumber.className = &#x27;step-marker-index&#x27;;
          labelNumber.textContent = String(index + 1);
          label.appendChild(labelNumber);
          label.addEventListener(&#x27;click&#x27;, (event) =&gt; {

          edgeLabels.push(label);
          const arrowPositions = useMidDirectionArrows ? [0.25, 0.75] : [0.82];
          arrowPositions.forEach((progress) =&gt; {
            const inverse = 1 - progress;
            const arrowPoint = [
              inverse * inverse * start[0] + 2 * inverse * progress * control[0] + progress * progress * end[0],
              inverse * inverse * start[1] + 2 * inverse * progress * control[1] + progress * progress * end[1]

            const tangent = [
              2 * inverse * (control[0] - start[0]) + 2 * progress * (end[0] - control[0]),

            const arrow = document.createElement(&#x27;span&#x27;);

            arrowIcon.setAttribute(&#x27;data-lucide&#x27;, &#x27;arrow-right&#x27;);
            arrow.appendChild(arrowIcon);
            directionArrows.push(arrow);
          });
        });
        edgeGroup.replaceChildren(...edgePaths);
        labelsContainer.replaceChildren(...edgeLabels, ...directionArrows);

        const steps = root.querySelector(&#x27;[data-modal-flow-steps]&#x27;);
        steps.replaceChildren(...stepText.map((text, index) =&gt; {
